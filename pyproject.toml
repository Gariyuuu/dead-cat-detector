[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadcat"
version = "1.0.0"
description = "Dead Cat Detector: conditional behaviour of extreme negative equity return events"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gary Wang" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "pyarrow>=15",
    "lightgbm>=4.0",
    "shap>=0.44",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
